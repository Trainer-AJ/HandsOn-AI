<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MCP Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    /* Light theme defaults */
    --card-bg: #ffffff;
    --card-border: rgba(16,24,40,0.06);
    --text: #0b1220;
    --muted: rgba(11,18,32,0.6);

    /* Bubbles: light backgrounds with dark text for readability */
    --bubble-text: #0b1220;
    --user-bg: #fff7b2; /* light yellow */
    --bot-bg: #e6f9d8;  /* light green */
    --bubble-shadow: rgba(11,18,32,0.06);

    /* Code block background for readability */
    --code-bg: rgba(11,18,32,0.04);

    --button-bg: rgba(0,0,0,0.06);
    --button-text: #0b1220;
    --input-bg: rgba(11,18,32,0.04);
    --input-border: rgba(11,18,32,0.06);
    --loader-color: rgba(0,0,0,0.7);
} 

/* Dark theme overrides applied when .dark class is on the .app element */
.app.dark {
    --card-bg: #0b1220;
    --card-border: rgba(255,255,255,0.03);
    --text: #e9eef8;
    --muted: rgba(255,255,255,0.7);

    /* Keep bubble text dark for contrast against light bubbles */
    --bubble-text: #0b1220;
    --user-bg: #fff4a3; /* slightly adjusted yellow */
    --bot-bg: #dff5c5;  /* slightly adjusted green */
    --bubble-shadow: rgba(0,0,0,0.35);

    --button-bg: rgba(255,255,255,0.06);
    --button-text: #e9eef8;
    --input-bg: rgba(255,255,255,0.02);
    --input-border: rgba(255,255,255,0.04);
    --loader-color: rgba(255,255,255,0.85);
} 

* { box-sizing: border-box; }

html, body {
    height: 100%;
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body {
    background: linear-gradient(270deg,#667eea,#764ba2,#ff7a7a,#ffd56b);
    background-size: 800% 800%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

@keyframes gradientShift {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.app {
    background: var(--card-bg);
    color: var(--text);
    width: 100%;
    max-width: 700px;
    height: 85vh;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--card-border);
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    transition: background 250ms ease, color 250ms ease, border-color 250ms ease;
}

header {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
}

.chat {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    overflow-x: hidden; /* prevent horizontal scrolling */
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px;
    margin-bottom: 10px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    transition: transform .12s ease, opacity .12s ease;
    opacity: 0;
    transform: translateY(6px);
}
.bubble.in { opacity: 1; transform: translateY(0); }

/* Markdown inside bubbles should be left-aligned for readability */
.bubble .markdown {
    text-align: left;
    color: var(--bubble-text); /* ensure dark text on light bubbles */
}
.bubble .markdown pre {
    background: var(--code-bg);
    padding: 12px;
    border-radius: 8px;
    overflow: auto;
    color: var(--bubble-text);
}
.bubble .markdown code {
    background: rgba(0,0,0,0.04);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', monospace;
    color: var(--bubble-text);
}
.bubble .markdown a { color: #0077cc; text-decoration: underline; }

/* User messages (right side style) */
.user {
    align-self: flex-end;
    background: var(--user-bg);
    color: var(--bubble-text);
    text-align: right;
    border-radius: 18px 18px 6px 18px;
    box-shadow: 0 6px 18px var(--bubble-shadow);
}

/* Bot messages (left side style) */
.bot {
    align-self: flex-start;
    background: var(--bot-bg);
    color: var(--bubble-text);
    text-align: left;
    border-radius: 18px 18px 18px 6px;
    box-shadow: 0 6px 18px var(--bubble-shadow);
}

footer {
    padding: 10px 14px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* Input area: full-width 'bubble' with Send button at extreme right */
.input-area {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
}

textarea {
    flex: 1;
    resize: none;
    border-radius: 999px; /* pill shape */
    padding: 12px 18px;
    min-height: 48px;
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--input-border);
    box-shadow: 0 6px 18px rgba(0,0,0,0.04);
}

button {
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    background: var(--button-bg);
    color: var(--button-text);
    min-width: 64px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

/* Make sure textarea and send button don't wrap on small screens */
@media (max-width:420px) {
    .input-area { gap: 8px; }
    textarea { padding: 10px 12px; min-height: 44px; }
    button { padding: 8px 10px; min-width: 48px; }
}

.mcp {
    font-size: 13px;
    opacity: 0.9;
    text-align: center;
    padding: 8px 12px;
}

/* Token counter */
.token-row { display:flex; align-items:center; gap:12px; padding: 6px 14px; border-top: 1px solid var(--card-border); position: sticky; bottom: 0; background: linear-gradient( rgba(0,0,0,0), rgba(0,0,0,0.02) ); z-index: 3; }
.token-counter { font-size:12px; color:var(--muted); min-width:140px; }
.token-bar { flex:1; height:8px; background: rgba(0,0,0,0.04); border-radius:999px; overflow:hidden; }
.token-fill { height:100%; width:0%; background: linear-gradient(90deg,#3ddc84,#ffd54f,#ff6b6b); transition: width 160ms linear, background 160ms linear; }
.token-note { font-size:11px; color:var(--muted); min-width:120px; text-align:right; }
.token-exceeded { color: #ff4d4f; }

/* loading dots */
.loader { display:inline-block; vertical-align: middle; }
.loader span { display:inline-block; width:8px; height:8px; background: var(--loader-color); border-radius:50%; margin:0 3px; animation: bounce 1s infinite; }
.loader span:nth-child(2){ animation-delay: 0.12s; }
.loader span:nth-child(3){ animation-delay: 0.24s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }

/* responsive tweaks */
@media (max-width:480px){ .app{ height: 92vh;} .bubble{ font-size:14px; } }
</style>
</head>

<body>
<div class="app" id="app">
    <header>
        <span>MCP Chat</span>
        <button id="themeBtn">🌙</button>
    </header>

    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="mcp" id="mcpStatus">MCP idle</div>

    <footer>
        <div class="input-area">
            <textarea id="input" rows="2" placeholder="Type a message..."></textarea>
            <button id="sendBtn">Send</button>
        </div>
    </footer>

    <!-- Token counter placed at the very bottom of the card -->
    <div class="token-row" aria-hidden="false" style="position:sticky; bottom:0;">
        <div class="token-counter" id="tokenCounter" aria-live="polite">0 / 16384 tokens</div>
        <div class="token-bar" role="progressbar" aria-valuemin="0" aria-valuemax="16384" aria-valuenow="0">
            <div class="token-fill" id="tokenFill" style="width:0%"></div>
        </div>
        <div class="token-note" id="tokenNote">1 token ≈ 4 chars</div>
    </div>
</div>

<!-- Markdown renderer and sanitizer -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const mcpStatus = document.getElementById("mcpStatus");
const app = document.getElementById("app");
const sendBtn = document.getElementById("sendBtn");
const themeBtn = document.getElementById("themeBtn");

// Token counter settings
const MAX_TOKENS = 16384;
const TOKEN_APPROX_RATIO = 4; // approx chars per token
const tokenCounter = document.getElementById('tokenCounter');
const tokenFill = document.getElementById('tokenFill');
const tokenNote = document.getElementById('tokenNote');

function estimateTokens(text) {
    if (!text) return 0;
    return Math.ceil(text.length / TOKEN_APPROX_RATIO);
}

function updateTokenUI() {
    const tokens = estimateTokens(input.value);
    const pct = Math.min(100, Math.round((tokens / MAX_TOKENS) * 100));
    if (tokenCounter) tokenCounter.textContent = `${tokens} / ${MAX_TOKENS} tokens`;
    if (tokenFill) tokenFill.style.width = pct + '%';
    // update ARIA for the progressbar
    const tokenBarEl = document.querySelector('.token-bar');
    if (tokenBarEl) tokenBarEl.setAttribute('aria-valuenow', Math.min(tokens, MAX_TOKENS));

    // color feedback
    let color = '#3ddc84';
    if (tokens >= MAX_TOKENS) color = '#ff4d4f';
    else if (tokens > MAX_TOKENS * 0.85) color = '#ffb74d';
    if (tokenFill) tokenFill.style.background = `linear-gradient(90deg, ${color}, ${color})`;

    if (tokenCounter) {
        tokenCounter.classList.toggle('token-exceeded', tokens > MAX_TOKENS);
    }
    if (tokenNote) {
        tokenNote.textContent = tokens > MAX_TOKENS ? 'Token limit reached. Please shorten input.' : '1 token ≈ 4 chars';
    }
    sendBtn.disabled = tokens > MAX_TOKENS;
}

input.addEventListener('input', updateTokenUI);
// initialize
updateTokenUI();

// Ensure links from rendered Markdown open in a new tab and are safe
if (window.DOMPurify && DOMPurify.addHook) {
    DOMPurify.addHook('afterSanitizeAttributes', function(node) {
        if (node.tagName && node.tagName.toLowerCase() === 'a') {
            node.setAttribute('target', '_blank');
            node.setAttribute('rel', 'noopener noreferrer');
        }
    });
}

function applyTheme(theme) {
    if (theme === 'dark') {
        app.classList.add('dark');
        themeBtn.textContent = '☀️';
        themeBtn.setAttribute('aria-pressed', 'true');
    } else {
        app.classList.remove('dark');
        themeBtn.textContent = '🌙';
        themeBtn.setAttribute('aria-pressed', 'false');
    }
    try { localStorage.setItem('theme', theme); } catch (e) { /* ignore */ }
}

themeBtn.addEventListener('click', () => applyTheme(app.classList.contains('dark') ? 'light' : 'dark'));

// Initialize theme from saved preference or system setting
const savedTheme = localStorage.getItem('theme');
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

function addBubble(text, cls) {
    const div = document.createElement("div");
    div.className = `bubble ${cls}`;
    div.textContent = text;
    chat.appendChild(div);
    // animate entrance
    requestAnimationFrame(() => div.classList.add('in'));
    chat.scrollTop = chat.scrollHeight;
    return div;
}

function createLoader() {
    const span = document.createElement('span');
    span.className = 'loader';
    span.innerHTML = '<span></span><span></span><span></span>';
    return span;
}

function setUIBusy(busy) {
    input.disabled = busy;
    sendBtn.disabled = busy;
    mcpStatus.textContent = busy ? 'Thinking…' : 'MCP idle';
}

async function send() {
    const message = input.value.trim();
    if (!message) return;

    // Prevent sending if input is above token limit
    const tokens = estimateTokens(message);
    if (tokens > MAX_TOKENS) {
        if (tokenNote) tokenNote.textContent = 'Token limit reached. Please shorten input.';
        if (tokenCounter) tokenCounter.classList.add('token-exceeded');
        return;
    }

    input.value = "";
    updateTokenUI();

    addBubble(message, "user");
    const botBubble = addBubble("", "bot");

    // show loader inside bot bubble until we receive a full reply
    const loader = createLoader();
    botBubble.appendChild(loader);

    setUIBusy(true);

    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
        });

        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();

        if (loader && loader.parentNode) loader.remove();

        // Render reply as Markdown -> sanitized HTML
        try {
            const replyText = data.reply ?? '(no reply)';
            if (window.marked && window.DOMPurify) {
                const raw = marked.parse(replyText);
                const clean = DOMPurify.sanitize(raw);
                botBubble.innerHTML = ''; // clear
                const md = document.createElement('div');
                md.className = 'markdown';
                md.innerHTML = clean;
                botBubble.appendChild(md);
            } else {
                botBubble.textContent = replyText;
            }
        } catch (err) {
            botBubble.textContent = data.reply ?? '(no reply)';
            console.error('Markdown render error', err);
        }
        chat.scrollTop = chat.scrollHeight;
    } catch (err) {
        if (loader && loader.parentNode) loader.remove();
        botBubble.textContent = 'Error: ' + (err.message || err);
        console.error(err);
    } finally {
        setUIBusy(false);
        updateTokenUI();
    }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
